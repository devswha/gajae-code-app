<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Film stage</title>
    <style>
      @font-face {
        font-family: 'Gajae Web Sans';
        src: url('/public/fonts/GajaeWebSans-Variable-latin.woff2') format('woff2');
        font-weight: 45 930;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: 'Geist Mono';
        src: url('/public/fonts/GeistMono-Variable-latin.woff2') format('woff2');
        font-weight: 100 900;
        font-style: normal;
        font-display: block;
      }
      :root {
        --sans: 'Gajae Web Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        --mono: 'Geist Mono', 'Gajae Web Sans', ui-monospace, Menlo, monospace;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: #000;
        overflow: hidden;
      }
      /* No CSS transitions or animations anywhere: seek(t) sets every value. */
      *,
      *::before,
      *::after {
        transition: none !important;
        animation: none !important;
      }
      #stage {
        position: relative;
        overflow: hidden;
        font-family: var(--sans);
      }
      .shot {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .shot img {
        position: absolute;
        left: 0;
        top: 0;
        max-width: none;
        user-select: none;
      }
      .ptr,
      .touch,
      .touch-ring {
        position: absolute;
        left: 0;
        top: 0;
        pointer-events: none;
      }
      .ptr svg {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      .touch {
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 255, 255, 0.5) 0%, rgba(255, 255, 255, 0.34) 55%, rgba(255, 255, 255, 0.12) 100%);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.35), 0 2px 10px rgba(0, 0, 0, 0.35);
      }
      .touch-ring {
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.9);
        box-sizing: border-box;
      }
      #debug {
        position: absolute;
        left: 8px;
        bottom: 8px;
        font: 12px/1.3 var(--mono);
        color: #83fca5;
        background: rgba(0, 0, 0, 0.7);
        padding: 4px 6px;
        white-space: pre;
        z-index: 1000;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script type="module" src="./stage.js"></script>
  </body>
</html>
