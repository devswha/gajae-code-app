name: Gajae Code App feature proposal
description: Suggest a better Gajae Code App workflow
title: '[Feature] '
body:
  - type: textarea
    id: workflow
    attributes:
      label: Workflow to improve
      description: >-
        Describe the task that is awkward today and who benefits if it becomes
        smoother. A real example helps us understand the problem before
        choosing an implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome you want
      description: >-
        Explain what you would be able to do after this improvement exists.
        Focus on the observable result rather than a particular technical
        solution.
    validations:
      required: true
  - type: textarea
    id: success
    attributes:
      label: Signal of success
      description: >-
        Name a visible result, saved state, or workflow step that would show
        the change solves the problem. This gives contributors a concrete way
        to review it.
  - type: textarea
    id: alternatives
    attributes:
      label: Options already tried
      description: >-
        Share workarounds, related tools, or alternate approaches you
        considered and why they do not fully solve the problem.
  - type: textarea
    id: context
    attributes:
      label: Context for planning
      description: >-
        Attach mockups, screenshots, links, compatibility needs, or constraints
        that would help scope the request. Do not include credentials or
        private project data.
