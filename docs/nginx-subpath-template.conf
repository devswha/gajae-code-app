# Nginx configuration for publishing Gajae Code App below a URL prefix.
#
# This sample exposes the app at /ai/ while the private application server stays
# at http://127.0.0.1:3001/. Requests below /ai are sent upstream without that
# prefix: /ai/session/example becomes /session/example.
#
# Nginx location patterns and rewrite regular expressions cannot use variables.
# When changing /ai, update $gajae_app_subpath and every [PATH] line together.
# The root /api/, /ws, and /shell endpoints remain proxied because the current
# client addresses them from the site root.

worker_processes 1;

events {
    # Suitable for local use and small installations; tune for the host if needed.
    worker_connections 1024;
}

http {
    # Choose the Connection value required by WebSocket upgrades.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        # Replace with an HTTPS listener and certificate directives for TLS.
        listen 80 default_server;
        server_name localhost 127.0.0.1;

        # Public mount point, without a final slash. [PATH] locations below are
        # literal because Nginx cannot interpolate this variable there.
        set $gajae_app_subpath /ai;

        # Address reachable only by Nginx for the application server.
        set $gajae_app_upstream http://127.0.0.1:3001;

        # Align the proxy limit with the application's 200 MB upload limit.
        client_max_body_size 200m;

        # [PATH] Keep the slash form canonical so relative browser URLs work.
        location = /ai {
            return 301 $gajae_app_subpath/;
        }

        # [PATH] Change both /ai literals and the rewrite when choosing another
        # mount point. The application receives paths rooted at /.
        location ^~ /ai/ {
            rewrite ^/ai(?<gajae_app_path>/.*)$ $gajae_app_path break;
            proxy_pass $gajae_app_upstream;

            # HTTP/1.1 and these headers support ordinary requests and upgrades.
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix $gajae_app_subpath;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Agent and terminal work can legitimately leave a connection idle.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # sub_filter needs an uncompressed upstream body. Rewrite absolute
            # browser asset URLs and PWA metadata to preserve the public prefix.
            proxy_set_header Accept-Encoding "";
            sub_filter_once off;
            sub_filter_types
                application/json
                application/manifest+json
                application/javascript
                text/javascript;

            sub_filter 'href="/' 'href="$gajae_app_subpath/';
            sub_filter 'src="/' 'src="$gajae_app_subpath/';
            sub_filter "register('/sw.js')" "register('$gajae_app_subpath/sw.js')";
            sub_filter 'register("/sw.js")' 'register("$gajae_app_subpath/sw.js")';
            sub_filter '"start_url": "/"' '"start_url": "$gajae_app_subpath/"';
            sub_filter '"scope": "/"' '"scope": "$gajae_app_subpath/"';
            sub_filter '"src": "/' '"src": "$gajae_app_subpath/';
            sub_filter "'/manifest.json'" "'$gajae_app_subpath/manifest.json'";
            sub_filter '"/manifest.json"' '"$gajae_app_subpath/manifest.json"';
        }

        # API calls are currently root-relative rather than prefix-aware.
        location ^~ /api/ {
            proxy_pass $gajae_app_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix $gajae_app_subpath;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Realtime application messages use this WebSocket route.
        location /ws {
            proxy_pass $gajae_app_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix $gajae_app_subpath;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # The in-browser terminal has a separate WebSocket endpoint.
        location /shell {
            proxy_pass $gajae_app_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix $gajae_app_subpath;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Used by the client version-check path.
        location = /health {
            proxy_pass $gajae_app_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix $gajae_app_subpath;
        }
    }
}
