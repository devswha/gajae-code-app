[package]
name = "gajae-app-desktop"
version = "0.2.9"
description = "Gajae Code App desktop shell"
license = "MIT"
authors = ["Gajae Code App contributors"]
edition = "2021"
rust-version = "1.85"
build = "build.rs"

[build-dependencies]
rustls-webpki = { version = "=0.103.15", default-features = false, features = ["std"] }
rustls-pki-types = "=1.15.1"
base64 = "=0.22.1"
libc = "=0.2.186"
semver = "=1.0.26"
sha2 = "=0.10.9"
serde_json = "=1.0.140"
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = ["unstable"] }
getrandom = "0.2"
fs2 = "=0.4.3"
libc = "=0.2.186"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
tauri-plugin-shell = "=2.3.6"
tauri-plugin-deep-link = "=2.4.10"
tokio = { version = "1", features = ["sync", "time"] }
tauri-runtime = "=2.11.3"
tauri-runtime-wry = "=2.11.4"

[target.'cfg(target_os = "macos")'.dependencies]
hmac = "=0.12.1"
block2 = "=0.6.2"
objc2 = { version = "=0.6.4", default-features = false, features = ["std"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSView", "NSWindow"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSError", "NSString"] }
objc2-web-kit = { version = "=0.3.2", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKContentWorld", "WKFrameInfo", "WKNavigation", "WKWebView"] }
rustls-webpki = { version = "=0.103.15", default-features = false, features = ["std"] }
rustls-pki-types = "=1.15.1"
rustls = { version = "=0.23.43", default-features = false, features = ["ring"] }
# Pin the updater release selected for the Tauri 2.11 stable graph.
# Keep the native reqwest client on the same minor so its
# no-redirect/HTTPS/timeout policy uses the API selected by the plugin.
tauri-plugin-updater = { version = "=2.11.0", default-features = false, features = ["rustls-tls"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider"] }
base64 = "=0.22.1"
futures-util = "=0.3.32"
minisign-verify = "=0.2.5"
semver = "=1.0.26"
tar = "=0.4.46"
flate2 = "=1.1.9"
plist = "=1.7.0"
